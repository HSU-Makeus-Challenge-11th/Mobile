# 로컬과 운영이 같이 쓰는 설정. 환경마다 달라지는 DB 주소는 application-{프로필}.yml에 둔다
spring:
  profiles:
    default: local # SPRING_PROFILES_ACTIVE가 없으면 로컬 설정을 읽는다
  jpa:
    hibernate:
      ddl-auto: validate # 엔티티와 테이블이 다르면 시작을 멈춘다. 테이블은 sql/01_schema.sql로 만든다
    open-in-view: false

jwt:
  secret: ${JWT_SECRET}
  access-expiration: ${JWT_ACCESS_EXPIRATION}

# 프론트 주소. 여러 개면 쉼표로 잇는다 (예: http://localhost:5173,https://프론트도메인)
cors:
  allowed-origins: ${FRONTEND_ORIGIN:http://localhost:5173}
