# EC2에서 RDS MySQL에 붙는 운영 설정. 값은 EC2 실행 환경에서 전달한다
server:
  address: 0.0.0.0 # 외부(프론트)에서 오는 요청도 받는다
  port: 8080
spring:
  datasource:
    url: jdbc:mysql://${DB_HOST}:3306/umc_movie
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate # 운영 데이터는 앱 시작 시 자동 변경하지 않는다
