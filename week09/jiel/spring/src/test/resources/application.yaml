# src/test/resources/application.yaml
# 테스트를 돌릴 때는 src/main/resources/application.yaml 대신 이 값들이 쓰입니다.
# 개발용 MySQL 대신 테스트 동안만 메모리에 만들어졌다 사라지는 H2를 씁니다.
spring:
  datasource:
    url: jdbc:h2:mem:umc_movie;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      # 테스트마다 메모리 DB의 스키마를 새로 만들어 엔티티 매핑도 함께 검증합니다.
      ddl-auto: create-drop
    open-in-view: false

# 이 값이 없으면 서버를 띄우는 단계에서 JwtUtil이 값을 찾지 못해 테스트가 시작도 못 합니다.
# 실제 비밀키가 아니라 테스트에서만 쓰는 값입니다.
jwt:
  secret: test-secret-for-context-loading-only
  access-expiration: 3600
