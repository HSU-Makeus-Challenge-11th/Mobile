# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
language: "ko-KR"
early_access: false
tone_instructions: "스터디 레포입니다. 모든 피드백에는 근거를 함께 적고, 꼭 고쳐야 하는 것이 아니면 앞에 [제안]을 붙여 구분하세요."

reviews:
  profile: "chill"
  request_changes_workflow: false
  high_level_summary: true
  high_level_summary_placeholder: "@coderabbitai summary"
  changed_files_summary: true
  collapse_walkthrough: true
  sequence_diagrams: true
  review_status: true
  poem: false
  assess_linked_issues: true
  related_issues: false
  related_prs: false
  suggested_labels: false
  auto_apply_labels: false
  suggested_reviewers: false
  auto_assign_reviewers: false

  path_filters:
    # Flutter: 플랫폼 폴더 (flutter create가 만든 코드) · 생성 코드
    - "!**/flutter/android/**"
    - "!**/flutter/ios/**"
    - "!**/flutter/macos/**"
    - "!**/flutter/linux/**"
    - "!**/flutter/windows/**"
    - "!**/flutter/web/**"
    - "!**/*.g.dart"
    - "!**/*.freezed.dart"
    - "!**/.metadata"
    - "!**/.dart_tool/**"
    # Spring: Gradle wrapper · IDE · QueryDSL 생성 코드
    - "!**/.gradle/**"
    - "!**/gradle/wrapper/**"
    - "!**/gradlew"
    - "!**/gradlew.bat"
    - "!**/.idea/**"
    - "!**/out/**"
    - "!**/src/main/generated/**"
    # NestJS: 의존성 · 빌드 결과물 · Prisma가 만든 마이그레이션 (schema.prisma를 대신 리뷰)
    - "!**/node_modules/**"
    - "!**/dist/**"
    - "!**/coverage/**"
    - "!**/package-lock.json"
    - "!**/pnpm-lock.yaml"
    - "!**/prisma/migrations/**"
    # 공통: lock · 빌드 결과물 · 에셋
    - "!**/*.lock"
    - "!**/build/**"
    - "!**/assets/**"
    - "!**/licenses/**"
    - "!**/.DS_Store"

  path_instructions:
    # ---------- Flutter ----------
    - path: "**/flutter/lib/**/*.dart"
      instructions: |
        Flutter 입문자의 주차별 미션 코드입니다.
        - 위젯 분리와 const 생성자 사용을 확인하세요.
        - TextEditingController, FocusNode 등의 dispose 누락을 확인하세요.
        - 하드코딩된 색상 · 크기 · 문자열이 theme나 상수로 분리됐는지 확인하세요.

    # ---------- Backend 공통 (Spring · NestJS) — 폴더: spring · nestjs (예전 backend 포함) ----------
    - path: "**/{backend,spring,nestjs}/**/*.{java,ts}"
      instructions: |
        백엔드 입문자의 주차별 미션 코드입니다. 사람마다 Spring(Java) 또는 NestJS(TypeScript)를 씁니다.
        - Controller → Service → Repository 계층의 역할이 섞이지 않았는지, 의존성을 생성자 주입으로 받는지 확인하세요.
        - Entity를 요청 · 응답에 그대로 쓰지 않고 DTO로 분리했는지 확인하세요.
        - URI가 자원 중심이고, HTTP 메서드와 상태 코드가 동작에 맞는지 확인하세요.
        - 요청 값을 검증하는지 확인하세요. (Spring: @Valid, NestJS: class-validator + 전역 ValidationPipe)
        - 예외를 한곳에서 처리하고 성공 · 실패 응답 형식이 일관적인지 확인하세요. (Spring: @RestControllerAdvice, NestJS: ExceptionFilter)
        - 여러 쓰기 작업을 트랜잭션으로 묶었는지, 반복문 안의 조회로 생기는 N+1 문제가 없는지 확인하세요.
          (Spring: @Transactional · 조회는 readOnly, NestJS: TypeORM DataSource.transaction · Prisma $transaction)

    # ---------- Backend: Spring Boot (Java · JPA) ----------
    - path: "**/{backend,spring}/**/{domain,entity}/**/*.java"
      instructions: |
        - @Setter를 열어 두지 않고 의미 있는 메서드로 상태를 바꾸는지 확인하세요.
        - @ManyToOne · @OneToOne이 FetchType.LAZY인지, enum이 @Enumerated(EnumType.STRING)인지 확인하세요.
        - 연관관계의 주인, cascade · orphanRemoval 설정이 ERD와 맞는지 확인하세요.
        - 생성 · 수정 시각을 공통 BaseEntity(@MappedSuperclass)로 모았는지 확인하세요.
    - path: "**/{backend,spring}/**/*Repository*.java"
      instructions: "메서드 이름 쿼리가 의도와 맞는지, 연관 엔티티를 함께 조회할 때 fetch join이나 @EntityGraph가 필요한지 확인하세요."
    - path: "**/{backend,spring}/**/src/main/resources/**"
      instructions: "DB 비밀번호, JWT 시크릿, 클라우드 키 같은 비밀 값이 하드코딩되지 않고 환경 변수로 분리됐는지 가장 먼저 확인하세요. ddl-auto 값이 실행 환경에 맞는지도 확인하세요."

    # ---------- Backend: NestJS (TypeScript) ----------
    - path: "**/{backend,nestjs}/**/*.ts"
      instructions: |
        - any 남용 없이 DTO · 반환 타입이 명시됐는지 확인하세요.
        - await 누락이나 처리되지 않은 Promise가 없는지 확인하세요.
        - Module의 providers · imports · exports가 필요한 만큼만 열려 있는지 확인하세요.
    - path: "**/{backend,nestjs}/**/*.{entity.ts,prisma}"
      instructions: "관계(onDelete, nullable), 인덱스, 칼럼 타입이 ERD와 맞는지 확인하세요. TypeORM은 eager 관계 남용, Prisma는 @relation과 @@index를 확인하세요."
    - path: "**/{backend,nestjs}/**/{.env*,*.config.ts,app.module.ts,main.ts}"
      instructions: |
        - .env에 실제 비밀 값이 있다면 커밋하면 안 된다고 지적하세요. .env.example에는 자리표시자만 있어야 합니다.
        - 설정 값을 @nestjs/config로 환경 변수에서 읽는지 확인하세요.
        - TypeORM synchronize: true가 운영 설정에 남아 있지 않은지, 전역 ValidationPipe · CORS 설정이 적절한지 확인하세요.

    # ---------- Backend 공통 파일 ----------
    - path: "**/{backend,spring,nestjs}/**/{build.gradle*,package.json}"
      instructions: "쓰지 않는 의존성, 버전 충돌, 테스트 · 개발 전용 의존성의 위치(testImplementation, devDependencies)를 확인하세요."
    - path: "**/{backend,spring,nestjs}/**/*.sql"
      instructions: |
        ERD 도구에서 내보낸 MySQL DDL입니다. 포맷보다 설계를 봐 주세요.
        - PK · FK와 1:N, N:M(매핑 테이블) 관계가 요구사항과 맞는지
        - 칼럼 타입 · 길이 · NULL 허용이 적절한지, 조회 조건 칼럼에 인덱스가 필요한지
        - 이름 규칙(snake_case)이 일관적인지
        내보낸 DDL에는 AUTO_INCREMENT나 제약 조건이 빠질 수 있으니, 같은 폴더 README의 설계 규칙도 함께 참고하세요.
    - path: "**/{backend,spring,nestjs}/**/{Dockerfile,docker-compose*.yml}"
      instructions: "베이스 이미지 버전 고정, 비밀 값 노출, 불필요한 레이어를 확인하세요."

    # ---------- 테스트 (Flutter test/, Spring src/test/, NestJS *.spec.ts) ----------
    - path: "**/{test/**,*.spec.ts}"
      instructions: "경계값 테스트 및 실패 케이스가 충분히 작성되었는지 확인하세요."

  auto_review:
    enabled: true
    auto_incremental_review: true
    drafts: false

  tools:
    github-checks:
      enabled: true
    # 비밀 값 커밋 탐지 (기본으로 켜져 있지만 의도를 드러내려고 명시)
    gitleaks:
      enabled: true
    # Spring(Java) 정적 분석
    pmd:
      enabled: true
    # NestJS(TypeScript) 정적 분석
    eslint:
      enabled: true
    # ERD SQL은 도구가 내보낸 DDL이라 탭 · 백틱 같은 포맷 지적만 늘어나서 끔
    sqlfluff:
      enabled: false

chat:
  auto_reply: true

knowledge_base:
  opt_out: false
  web_search:
    enabled: true
  code_guidelines:
    enabled: true
    filePatterns:
      - "README.md"
  learnings:
    scope: "auto"
  issues:
    scope: "auto"
  pull_requests:
    scope: "auto"
